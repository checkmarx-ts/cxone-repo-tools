name: Publish a Release
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'The version tag to use in the form of x.x.x'
        required: true
        type: string
      prerelease:
        description: 'Check if this is to publish a pre-release.'
        required: true
        type: boolean


permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  PRERELEASE: ${{ inputs.prerelease }}

jobs:
  tag-repo:
    runs-on: cx-private-ubuntu-x64
    outputs:
      tag: ${{ steps.tag-string.outputs.tag }}
      whl_tag: ${{ steps.tag-string.outputs.whl_tag }}
    permissions:
      # Need to commit a tag indicating the version
      contents: write
    steps:
      - name: Create tag
        id: tag-string
        run: |
          [ ${PRERELEASE} = false ] && export TAG=${VERSION} || \
            export TAG=${VERSION}-${GITHUB_RUN_NUMBER}-prerelease

          [ ${PRERELEASE} = false ] && export WHL_TAG=${VERSION} || \
            export WHL_TAG=${VERSION}rc${GITHUB_RUN_NUMBER}

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "whl_tag=$WHL_TAG" >> $GITHUB_OUTPUT

      - name: Validate no tag
        env:
          TAG: ${{ steps.tag-string.outputs.tag }}
        run: |
          set +e
          git clone --branch "${TAG}" --depth=1 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} > /dev/null 2>&1 && exit 1
          set -e

      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set Tag
        env:
          TAG: ${{ steps.tag-string.outputs.tag }}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"

  remove-tag-on-failure:
    needs: [tag-repo, publish-release]
    permissions:
      # Need to remove the tag if there is a failure
      contents: write
    runs-on: cx-private-ubuntu-x64
    if: (failure() || cancelled()) && needs.tag-repo.result == 'success'
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Remove tag
        run: git push origin ':refs/tags/${{ needs.tag-repo.outputs.tag }}'

  artifact-cleanup:
    runs-on: cx-private-ubuntu-x64
    needs: [publish-release]
    if: always()
    steps:
      - uses: step-security/delete-artifact@9a5b2d6793eb97cf052deddb87cd073aabb77385 # v6.0.0
        with:
          name: |
            whl-${{ github.run_number }}
            doc-skill-${{ github.run_number }}

  build-wheel:
    needs: [tag-repo]
    uses: ./.github/workflows/build-whl.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag-repo.outputs.tag }}
      whl_tag: ${{ needs.tag-repo.outputs.whl_tag }}

  build-docs:
    needs: [tag-repo]
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag-repo.outputs.tag }}
      whl_tag: ${{ needs.tag-repo.outputs.whl_tag }}


  publish-release:
    runs-on: cx-private-ubuntu-x64
    permissions:
      # Can't publish a release unless this can write.
      contents: write
    needs: 
      - tag-repo
      - build-wheel
      - build-docs
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: whl-${{ github.run_number }}

      - name: Download AI skill
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: doc-skill-${{ github.run_number }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Make release text
        run: |
          echo "# cxone-repo-tools ${{ needs.tag-repo.outputs.tag }}" > release.md

          echo "" >> release.md
          python3 .github/workflows/scripts/json2md.py release_notes.json ${VERSION} >> release.md
          echo "" >> release.md

          WHEEL_NAME=$(basename $(ls *.whl))
          WHEEL_HASH=$(pip3 hash $WHEEL_NAME | grep "^--")
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.tag-repo.outputs.tag }}/$WHEEL_NAME"

          echo '```' >> release.md
          echo $RELEASE_URL >> release.md
          echo '```' >> release.md

          echo "## Hashes" >> release.md
          echo "### $WHEEL_NAME" >> release.md
          echo '```' >> release.md
          echo "$WHEEL_HASH" >> release.md
          echo '```' >> release.md


      - name: Create GitHub Release
        id: create_release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ./*.whl, ./*.zip
          bodyFile: release.md
          name: ${{ needs.tag-repo.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ needs.tag-repo.outputs.tag }}

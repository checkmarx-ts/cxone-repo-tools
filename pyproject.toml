[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cxone-repo-tools"
dynamic = ["version"]
dependencies = [
  "docopt-ng==0.9.0",
  "aiocsv==1.4.1",
  "aiofiles==25.1.0",
  "tqdm==4.70.0",
  "cxone-async-api==1.1.8"
]
readme = "README.md"

description = "CheckmarxOne Repository Tools"
requires-python = ">=3.10"

[project.scripts]
cxone-repo-tools = "cxone_repo_tools.__main__:cli_entry"

[tool.setuptools]
package-dir = {"cxone_repo_tools" = "src/cxone_repo_tools"}

[tool.setuptools.dynamic]
version = { attr = "cxone_repo_tools.__version__" }

[tool.pydoc-markdown]
loaders = [
  { type = "python", search_path = ["./src"], packages = ["cxone_repo_tools"]}
]

processors = [
  { type = "filter", skip_empty_modules = true, documented_only=true },
]

[tool.pydoc-markdown.renderer]
type = "markdown"
filename = "ai/skills/cxone-repo-tools/references/cxone-repo-tools-docs.md"
